<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Girih all the way down — IWER test harness</title></head>
<body>
<!-- Test only: Meta's Immersive Web Emulation Runtime stands in for a Quest 3 with hand tracking; ?wall=1 adds a stand-in room. -->
<script type="module">
  import { XRDevice, metaQuest3 } from './iwer.module.js';
  import { WallSEM } from './wall-sem.js';
  const d = new XRDevice(metaQuest3);
  if (new URLSearchParams(location.search).has('wall')) d.installSEM(WallSEM);
  d.installRuntime({ forceInstall: true });   // Chromium ships a (headset-less) navigator.xr
  d.primaryInputMode = 'hand';
  window.xrDevice = d;
  const html = await (await fetch('../zoom.html')).text();
  document.body.innerHTML = html.match(/<body>([\s\S]*)<script/)[1];
  await import('../zoom.js');
</script>
</body></html>
