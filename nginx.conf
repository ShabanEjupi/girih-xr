# No hashed file names here, so the CDN and browsers must revalidate every file; otherwise an edge keeps an old app.js.
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-cache" always;
  index index.html;
  location / { try_files $uri $uri/ =404; }
  # Lab for two: Server-Sent Events must not be buffered, and a room can stay open for an hour.
  location /room/ {
    proxy_pass http://relay:8323;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 8k;
  }
}
